# TLS via certbot. Rate limits here are in addition to the app's own.
limit_req_zone $binary_remote_addr zone=dk:10m rate=10r/s;
server {
  listen 443 ssl http2; server_name your-domain.in;
  # ssl_certificate ...; ssl_certificate_key ...;
  client_max_body_size 300m;   # admin PDF uploads
  add_header Strict-Transport-Security "max-age=31536000" always;
  # Real client IP is read from X-Forwarded-For when TRUST_PROXY=1. Secure cookies follow BASE_URL (https).
  location / { limit_req zone=dk burst=30 nodelay; proxy_pass http://127.0.0.1:8080; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto https; proxy_set_header Host $host; }
  # Razorpay calls this from its own servers: keep it open to the internet (the app checks the HMAC signature).
  location = /api/webhook/razorpay { proxy_pass http://127.0.0.1:8080; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto https; proxy_set_header Host $host; }
  # Admin API (incl. UPI payment approval and manual grants): office IP only.
  location /api/admin/ { allow YOUR.OFFICE.IP; deny all; proxy_pass http://127.0.0.1:8080; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto https; proxy_set_header Host $host; }
}
